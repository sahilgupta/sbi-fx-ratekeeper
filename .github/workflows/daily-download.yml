name: Download the file from SBI server, at 3:00 PM everyday

on:
  schedule:
    # Runs "at 4:30 PM and 10:30 PM IST time (i.e. 10:30 AM and 4:30 PM UTC)" (see https://crontab.guru)
    - cron: "30 10,16 * * *"
  workflow_dispatch:


jobs:
  build:

    name: Download Rates FILE

    runs-on: ubuntu-latest

    # main.py retries for a while when SBI is down, but should never hang forever
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

      # poppler is used to convert pdf to images
    - name: Install poppler
      run: |
        sudo apt-get update
        sudo apt-get install -y poppler-utils

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

      # Exits non-zero if the rates could not be saved, so the run shows up as failed
    - name: Download and save file
      env:
        ANTHROPIC_API_KEY: ${{ secrets.anthropic_api_key }}
      run: python main.py

      # The steps below run even if the download failed, so log.txt is still committed
    - name: Get current time
      if: ${{ !cancelled() }}
      uses: josStorer/get-current-time@v2.0.2
      id: current-time
      with:
        format: "dddd, MMMM Do YYYY, h:mm:ss a"
        utcOffset: "+05:30"

      # Commit the PDF and the updated rates in csv
    - uses: stefanzweifel/git-auto-commit-action@v5
      if: ${{ !cancelled() }}
      with:
        commit_message: "Auto Commit: SBI rates at ${{ steps.current-time.outputs.formattedTime }}"
